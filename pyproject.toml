[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-advocate"
dynamic = ["version"]
description = "Private local evidence store for Agent Advocate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-advocate = "agent_advocate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "agent_advocate.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
